services:
  postgres:
    image: postgres:16-alpine
    container_name: talent-pool-postgres
    environment:
      POSTGRES_DB: talent_pool
      POSTGRES_USER: talent_pool
      POSTGRES_PASSWORD: talent_pool
    ports:
      - "5432:5432"
    volumes:
      - talent_pool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_pool -d talent_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talent_pool_pgdata:
