spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: mail.sarinah.com
    port: 465
    username: ${MAIL_USERNAME:talentpool@sarinah.co.id}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

app:
  storage:
    root: ${STORAGE_ROOT:/opt/peoplecounter/uploads}
  mail:
    enabled: true
    from: ${APP_MAIL_FROM:talentpool@sarinah.co.id}
  security:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    recruiter-username: ${RECRUITER_USERNAME}
    recruiter-password: ${RECRUITER_PASSWORD}
  jwt:
    secret: ${TALENT_JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

