server:
  port: ${SERVER_PORT:8004}

spring:
  application:
    name: talent-pool-api
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: administrator
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 110MB
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:talentpool@sarinah.co.id}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  web:
    base-path: ${APP_WEB_BASE_PATH:/sarinah-talent-pool}
    public-url: ${APP_PUBLIC_URL:https://satudata.sarinah.com/sarinah-talent-pool}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:talentpool@sarinah.co.id}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    expose-reset-url: ${PASSWORD_RESET_EXPOSE_URL:false}
  storage:
    root: ${STORAGE_ROOT:./uploads}
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    recruiter-username: ${RECRUITER_USERNAME:recruiter}
    recruiter-password: ${RECRUITER_PASSWORD:Recruiter123!}
  jwt:
    secret: ${TALENT_JWT_SECRET:local-dev-only-talent-jwt-secret-change-this-2026}
    expiration-minutes: ${TALENT_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
