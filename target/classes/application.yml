server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: talent-pool-api
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: administrator
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 110MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    root: ${STORAGE_ROOT:./uploads}
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    recruiter-username: ${RECRUITER_USERNAME:recruiter}
    recruiter-password: ${RECRUITER_PASSWORD:Recruiter123!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
